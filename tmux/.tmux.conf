set-option -ga terminal-overrides ',xterm-256color:RGB'

set-option -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on

# Forward session:pwd to the outer terminal title (ghostty tab/window)
set -g set-titles on
set -g set-titles-string '#I:#S:#{s|#{HOME}|~|:pane_current_path}/#{pane_current_command}'
# increase scroll-back history
# set -g history-limit 10000

# use vim key bindings
setw -g mode-keys vi
set-option -g mouse on

# decrease command delay (increases vim responsiveness)
set -sg escape-time 1

# increase repeat time for repeatable commands
set -g repeat-time 1000

# start window index at 1
set -g base-index 1

# start pane index at 1
setw -g pane-base-index 1

# automatically renumber windows when one is closed
set -g renumber-windows on

# don't shrink a window to the smallest attached client viewing it
setw -g aggressive-resize off

###########################
#  Key Bindings
###########################

# tmux prefix
unbind C-b
set -g prefix C-j

# copy with 'enter' or 'y' and send to mac os clipboard: http://goo.gl/2Bfn8

# create 'v' alias for selecting text
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-selection
#bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -Tcopy-mode-vi Escape send -X cancel
bind-key -Tcopy-mode-vi V send -X rectangle-toggle
# paste
unbind C-p
bind C-p paste-buffer

# windows back
unbind C-p
unbind C-b
bind Tab previous-window
# mở popup terminal 80x20, ở giữa
bind f display-popup -E -w 80% -h 80% -T "Floating"
# small floating terminal in the top-right corner
unbind a
bind a display-popup -E -x R -y 0 -w 45% -h 30% -d "#{pane_current_path}" -T "Floating"
# mở popup neovim ở thư mục hiện tại
bind v display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T "Neovim" nvim
# window manager: fuzzy switch windows across sessions in a floating popup.
# Provided by the local tmux-window-manager Go plugin, which builds its binary
# on demand, binds prefix+w (override with @twm_key), and exports @twm_bin.
unbind w
run-shell "$HOME/code/tmux-window-manager/tmux-window-manager.tmux"
# window splitting
unbind %
bind | split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v

bind -r < swap-window -t :-1 \; select-window -t :-1
bind -r > swap-window -t :+1 \; select-window -t :+1

# prompt for a target index to swap with
bind S command-prompt -p "swap with window index:" "swap-window -t '%%'; select-window -t '%%'"

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# create 25% lower split
unbind t
bind t split-window -p 25

# quickly switch panes
unbind ^J
bind ^J select-pane -t :.+

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# override ctrl+k to do nothing (prevent terminal clearing)
unbind C-k
bind C-k send-keys ''

###########################
# Status Bar — Ayu powerline theme
###########################
# Palette follows ayutheme.com syntax accents.
# bg #0F1419 / surface #1F2430 / fg #E6E1CF / muted #B3B1AD
# red #F28779 / orange #FFA659 / yellow #FFCD66 / green #D5FF80
# aqua #95E6CB / cyan #5CCFE6 / blue #73D0FF / purple #DFBFFF

set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0F1419,fg=#E6E1CF"
set -g status-left-length 100
set -g status-right-length 200

# messages
set -g message-style "bg=#1F2430,fg=#E6E1CF"
set -g message-command-style "bg=#1F2430,fg=#E6E1CF"

# pane borders
set -g pane-border-style "fg=#1F2430"
set -g pane-active-border-style "fg=#95E6CB"

# pane number display
set -g display-panes-active-colour "#95E6CB"
set -g display-panes-colour "#73D0FF"

# clock
set-window-option -g clock-mode-colour "#FFCD66"

# left: session name
set -g status-left "#[fg=#0F1419,bg=#73D0FF,bold]  #S #[fg=#73D0FF,bg=#0F1419]"

# windows
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#0F1419,bg=#1F2430]#[fg=#B3B1AD,bg=#1F2430] #I: #(basename '#{pane_current_path}')/#(~/code/tmux-window-manager/bin/tmux-window-manager label #{pane_pid} #{pane_current_command}) #[fg=#1F2430,bg=#0F1419]"
setw -g window-status-current-format "#[fg=#0F1419,bg=#FFCD66]#[fg=#0F1419,bg=#FFCD66,bold] #I: #(basename '#{pane_current_path}')/#(~/code/tmux-window-manager/bin/tmux-window-manager label #{pane_pid} #{pane_current_command}) #[fg=#FFCD66,bg=#0F1419]"

# right: date, time (hidden on mobile-sized clients)
set -g status-right "#{?#{<:#{client_width},80},,#[fg=#FFA659,bg=#0F1419]#[fg=#0F1419,bg=#FFA659] %b %d #[fg=#95E6CB,bg=#FFA659]#[fg=#0F1419,bg=#95E6CB,bold] %H:%M }"

###########################
# Plugins (TPM)
###########################
# TPM itself must be the first plugin listed.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# Use the local development checkout above instead of a TPM-managed clone.
# set -g @plugin 'thaodangspace/tmux-window-manager'

# Cấu hình resurrect + continuum
set -g @resurrect-capture-pane-contents 'on'     # Lưu nội dung pane
set -g @continuum-restore 'on'                   # Tự động restore
set -g @continuum-save-interval '15'             # Save mỗi 15 phút

# Initialize TMUX plugin manager — KEEP THIS LINE AT THE VERY BOTTOM.
run '~/.tmux/plugins/tpm/tpm'
