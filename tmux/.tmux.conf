set-option -ga terminal-overrides ',xterm-256color:RGB'

set-option -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on

# Forward session:pwd to the outer terminal title (ghostty tab/window)
set -g set-titles on
set -g set-titles-string '#S:#{s|#{HOME}|~|:pane_current_path}'
# increase scroll-back history
# set -g history-limit 10000

# use vim key bindings
setw -g mode-keys vi
set-option -g mouse on

# decrease command delay (increases vim responsiveness)
set -sg escape-time 1

# increase repeat time for repeatable commands
set -g repeat-time 1000

# start window index at 1
set -g base-index 1

# start pane index at 1
setw -g pane-base-index 1

# automatically renumber windows when one is closed
set -g renumber-windows on

###########################
#  Key Bindings
###########################

# tmux prefix
unbind C-b
set -g prefix C-j

# copy with 'enter' or 'y' and send to mac os clipboard: http://goo.gl/2Bfn8

# create 'v' alias for selecting text
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-selection
#bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -Tcopy-mode-vi Escape send -X cancel
bind-key -Tcopy-mode-vi V send -X rectangle-toggle
# paste
unbind C-p
bind C-p paste-buffer

# windows back
unbind C-p
unbind C-b
bind Tab previous-window
# mở popup terminal 80x20, ở giữa
bind f display-popup -E -w 80% -h 80% -T "Floating"
# window splitting
unbind %
bind | split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v

bind -r < swap-window -t :-1 \; select-window -t :-1
bind -r > swap-window -t :+1 \; select-window -t :+1

# prompt for a target index to swap with
bind S command-prompt -p "swap with window index:" "swap-window -t '%%'; select-window -t '%%'"

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# create 25% lower split
unbind t
bind t split-window -p 25

# quickly switch panes
unbind ^J
bind ^J select-pane -t :.+

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# override ctrl+k to do nothing (prevent terminal clearing)
unbind C-k
bind C-k send-keys ''

###########################
# Status Bar — Solarized Osaka powerline theme
###########################
# Palette matches nvim (craftzdog/solarized-osaka.nvim) and ghostty Solarized Dark.
# bg #001020 / base02 #073642 / blue #268bd2 / cyan #2aa198 / green #859900
# yellow #b58900 / fg #93a1a1 / cream #fdf6e3

set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#001020,fg=#93a1a1"
set -g status-left-length 100
set -g status-right-length 200

# messages
set -g message-style "bg=#073642,fg=#93a1a1"
set -g message-command-style "bg=#073642,fg=#93a1a1"

# pane borders
set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#2aa198"

# pane number display
set -g display-panes-active-colour "#2aa198"
set -g display-panes-colour "#268bd2"

# clock
set-window-option -g clock-mode-colour "#2aa198"

# left: session name
set -g status-left "#[fg=#001020,bg=#268bd2,bold]  #S #[fg=#268bd2,bg=#001020]"

# windows
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#001020,bg=#073642]#[fg=#93a1a1,bg=#073642] #(basename '#{pane_current_path}')/#{pane_current_command} #[fg=#073642,bg=#001020]"
setw -g window-status-current-format "#[fg=#001020,bg=#2aa198]#[fg=#001020,bg=#2aa198,bold] #(basename '#{pane_current_path}')/#{pane_current_command} #[fg=#2aa198,bg=#001020]"

# right: date, time
set -g status-right "#[fg=#268bd2,bg=#001020]#[fg=#fdf6e3,bg=#268bd2] %b %d#[fg=#2aa198,bg=#268bd2]#[fg=#001020,bg=#2aa198,bold] %H:%M "
